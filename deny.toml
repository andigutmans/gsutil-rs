# cargo-deny configuration for gsutil-rs
[graph]
all-features = false

[advisories]
version = 2
ignore = [
    # rsa 0.9.x Marvin Attack affects network-observable RSA decryption timing sidechannels.
    # gsutil-rs only performs local PKCS#1 v1.5 signing (JWT / signurl), never RSA decryption.
    # Remove once rsa 0.10 stabilizes.
    "RUSTSEC-2023-0071",
    # chrono unmaintained notice (no security vulnerability); track future migration to jiff/time.
    "RUSTSEC-2026-0543",
]

[licenses]
version = 2
confidence-threshold = 0.8
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
    "CDLA-Permissive-2.0",
]

[bans]
multiple-versions = "allow"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
