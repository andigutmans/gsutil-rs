name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Format, Clippy & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Run unit & integration tests
        run: cargo test --workspace
      - name: Build gsutil CLI binary
        run: cargo build -p gsutil-cli
      - name: Run differential parity (offline)
        run: cargo run -p gsutil-parity -- --mode offline
      - name: Run differential parity (mock GCS)
        run: cargo run -p gsutil-parity -- --mode mock
