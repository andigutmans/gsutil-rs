name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  security:
    name: Security & License Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          arguments: --all-features
          command-arguments: advisories licenses sources

  test:
    name: Build, Clippy & Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace
      - name: Build release binary & smoke test
        shell: bash
        run: |
          cargo build --release -p gsutil-cli
          ./target/release/gsutil version
          ./target/release/gsutil help | head -n 5

  parity:
    name: Differential Parity vs Python gsutil (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Set up Python with crcmod (for reference Python gsutil)
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install crcmod for reference Python gsutil
        shell: bash
        run: |
          python -m pip install --quiet crcmod
          echo "CLOUDSDK_PYTHON=$(which python)" >> "${GITHUB_ENV}"
      - name: Set up Google Cloud SDK (Python gsutil)
        uses: google-github-actions/setup-gcloud@v2
      - name: Build release gsutil & gsutil-parity
        run: cargo build --release -p gsutil-cli -p gsutil-parity
      - name: Run offline & TLS mock differential parity
        shell: bash
        run: |
          EXT=""
          if [[ "${RUNNER_OS}" == "Windows" ]]; then EXT=".exe"; fi
          REF_BIN="$(command -v gsutil.cmd || command -v gsutil)"
          echo "Reference Python gsutil: ${REF_BIN}"
          "${REF_BIN}" version
          ./target/release/gsutil-parity${EXT} \
            --mode offline \
            --ref-bin "${REF_BIN}" \
            --rust-bin "./target/release/gsutil${EXT}"
          ./target/release/gsutil-parity${EXT} \
            --mode mock \
            --ref-bin "${REF_BIN}" \
            --rust-bin "./target/release/gsutil${EXT}"
