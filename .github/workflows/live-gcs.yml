name: Live GCS Integration (Manual)

on:
  workflow_dispatch:
    inputs:
      run_stage1:
        description: "Also run Stage 1 200 MiB streaming / crash-resume gates"
        type: boolean
        default: false

env:
  CARGO_TERM_COLOR: always

jobs:
  live-gcs:
    name: Live GCS Parity (${{ matrix.os }})
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Set up Python with crcmod (for reference Python gsutil)
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install crcmod for reference Python gsutil
        shell: bash
        run: |
          python -m pip install --quiet crcmod
          PY_EXE="$(python -c 'import sys; print(sys.executable)')"
          echo "CLOUDSDK_PYTHON=${PY_EXE}" >> "${GITHUB_ENV}"
      - name: Authenticate to GCP (dedicated test SA)
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      - name: Set up Google Cloud SDK (Python gsutil)
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GSUTIL_TEST_PROJECT }}
      - name: Configure isolated SA .boto for Python & Rust gsutil
        shell: bash
        run: |
          BOTO_FILE="${RUNNER_TEMP}/ci-sa.boto"
          cat > "${BOTO_FILE}" <<EOF
          [Credentials]
          gs_service_key_file = ${GOOGLE_APPLICATION_CREDENTIALS}
          [GSUtil]
          default_project_id = ${{ secrets.GSUTIL_TEST_PROJECT }}
          EOF
          echo "BOTO_CONFIG=${BOTO_FILE}" >> "${GITHUB_ENV}"
          echo "BOTO_PATH=${BOTO_FILE}" >> "${GITHUB_ENV}"
          echo "CLOUDSDK_CORE_PASS_CREDENTIALS_TO_GSUTIL=false" >> "${GITHUB_ENV}"
      - name: Build release gsutil & gsutil-parity
        run: cargo build --release -p gsutil-cli -p gsutil-parity
      - name: Run live GCS differential parity
        shell: bash
        env:
          CLOUDSDK_CORE_PROJECT: ${{ secrets.GSUTIL_TEST_PROJECT }}
          GSUTIL_TEST_PROJECT: ${{ secrets.GSUTIL_TEST_PROJECT }}
          GSUTIL_TEST_BUCKET: ${{ secrets.GSUTIL_TEST_BUCKET }}
        run: |
          EXT=""
          if [[ "${RUNNER_OS}" == "Windows" ]]; then EXT=".exe"; fi
          REF_BIN="$(command -v gsutil.cmd || command -v gsutil)"
          ./target/release/gsutil-parity${EXT} \
            --mode live \
            --ref-bin "${REF_BIN}" \
            --rust-bin "./target/release/gsutil${EXT}"
      - name: Run Stage 1 200 MiB streaming gates (optional)
        if: ${{ inputs.run_stage1 }}
        shell: bash
        env:
          GSUTIL_TEST_PROJECT: ${{ secrets.GSUTIL_TEST_PROJECT }}
          GSUTIL_TEST_BUCKET: ${{ secrets.GSUTIL_TEST_BUCKET }}
        run: |
          EXT=""
          if [[ "${RUNNER_OS}" == "Windows" ]]; then EXT=".exe"; fi
          REF_BIN="$(command -v gsutil.cmd || command -v gsutil)"
          ./target/release/gsutil-parity${EXT} \
            --mode stage1 \
            --ref-bin "${REF_BIN}" \
            --rust-bin "./target/release/gsutil${EXT}"
